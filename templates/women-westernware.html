{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stylish Western Wear for Women</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-image: url("{% static 'images/westernware.jpg' %}");
      height: 100%;
      width: 100%;
      background-size: cover;
      background-attachment: fixed;
      position: relative;
      padding: 20px;
    }
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.32);
      z-index: 0;
    }

    header, .search-bar, .container, .logo {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #222;
      background-color: rgba(255, 255, 255, 0.8);
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .search-bar input {
      width: 300px;
      padding: 10px;
      border: 2px solid #007bff;
      border-radius: 25px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-bar input:focus {
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 10px;
      max-width: 1300px;
      margin: 30px auto 0;
    }

    .card {
      background: white;
      border-radius: 25px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      text-align: center;
    }

    .card-content h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .price {
      color: #28a745;
      font-weight: bold;
      margin-bottom: 15px;
      display: block;
    }

    .btn {
      background: linear-gradient(to right, #007bff, #0056b3);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      transition: background 0.3s ease;
      display: inline-block;
    }

    .btn:hover {
      background: linear-gradient(to right, #0056b3, #007bff);
    }
    .logo {
      height: 100px;
      width: 100px;
    }
  </style>
</head>
<body>
  <div class="flex-1 items-left">
    <a href="/">
      <img src="{% static 'images/logo1.png' %}" alt="ShopEase Logo" class="logo" />
    </a>
  </div>

  <header>
    <h1>Stylish Western Wear for Women</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search shirts..." />
    </div>
  </header>

  <!-- ✅ Single Container for All Cards -->
  <div class="container" id="shirtContainer">
    <!-- Example cards (merge all yours here) -->
    <div class="card" data-name="casual black shirt style 1">
      <img src="https://images.meesho.com/images/products/568076009/ll0du_512.avif?width=512" alt="Black Shirt" />
      <div class="card-content">
        <h3>Casual Black Shirt</h3>
        <span class="price">₹799</span>
        <a href="/womens_westernware1_detailed" class="btn">View Product</a>
      </div>
    </div>

    <div class="card" data-name="white slim fit shirt style 1">
      <img src="https://m.media-amazon.com/images/I/61GA8gq3zpL._SY741_.jpg" alt="White Shirt" />
      <div class="card-content">
        <h3>White Slim Fit Shirt</h3>
        <span class="price">₹899</span>
        <a href="/womens_westernware2_detailed" class="btn">View Product</a>
      </div>
    </div>

    <!-- 👉 Continue adding your other product cards here, no need for extra containers -->
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.card');

    searchInput.addEventListener('keyup', () => {
      const searchValue = searchInput.value.toLowerCase();
      cards.forEach(card => {
        const name = card.getAttribute('data-name').toLowerCase();
        card.style.display = name.includes(searchValue) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
